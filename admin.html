<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel Editorial | Notícias IPMO</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="topbar"><div class="container topbar-inner"><span>Painel Editorial — Notícias IPMO</span><a href="index.html">Ver página pública →</a></div></div>
<header class="header"><div class="container header-inner"><a class="brand" href="index.html"><img src="assets/logo-ipmo.png" alt="IPMO"></a></div></header>
<main class="admin-page"><div class="container admin-wrap"><div id="adminStatus" class="admin-status"></div>
<section id="loginPanel" class="admin-card" hidden><h1>Acesso editorial</h1><p>Entre com sua conta autorizada.</p><form id="loginForm" class="admin-form"><label>E-mail<input name="email" type="email" required></label><label>Senha<input name="password" type="password" required></label><button class="btn primary" type="submit">Entrar</button></form><div class="first-access"><p><strong>Primeiro acesso?</strong> Crie sua senha usando o e-mail previamente autorizado.</p><button id="showSignupBtn" class="btn ghost" type="button">Criar primeiro acesso</button><form id="signupForm" class="admin-form" hidden><label>Nome completo<input name="full_name" required></label><label>E-mail<input name="email" type="email" required></label><label>Crie uma senha<input name="password" type="password" minlength="8" required></label><label>Repita a senha<input name="password2" type="password" minlength="8" required></label><button class="btn primary" type="submit">Cadastrar acesso</button></form></div></section>
<section id="editorPanel" hidden><div class="admin-head"><div><span class="section-kicker">PAINEL EDITORIAL</span><h1>Notícias IPMO</h1><p>Conectado como <strong id="whoami"></strong></p></div><button id="logoutBtn" class="btn ghost">Sair</button></div><div class="admin-grid"><section class="admin-card"><h2 id="formTitle">Nova notícia</h2><form id="postForm" class="admin-form"><label>Título<input id="title" name="title" required></label><label>Endereço (slug)<input id="slug" name="slug" required></label><label>Resumo<textarea id="excerpt" name="excerpt" rows="3"></textarea></label><label>Texto da matéria<textarea id="content" name="content" rows="12" required></textarea></label><div class="form-two"><label>Categoria<select id="category" name="category"></select></label><label>Status<select id="status" name="status"><option value="draft">Rascunho</option><option value="published">Publicada</option><option value="archived">Arquivada</option></select></label></div><label>Imagem de capa<input id="image" name="image" type="file" accept="image/*"></label><input id="currentImage" type="hidden"><label class="check"><input id="featured" name="featured" type="checkbox"> Marcar como destaque</label><div class="hero-actions"><button class="btn primary" type="submit">Salvar notícia</button><button class="btn ghost" id="resetBtn" type="button">Limpar</button></div></form></section><section class="admin-card"><h2>Conteúdo cadastrado</h2><div id="postsList"></div></section></div></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script><script src="admin.js"></script></body></html>
